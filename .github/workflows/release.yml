name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.10"
      - run: python -m unittest discover -s tests -v
        env:
          PYTHONUTF8: 1
      - run: npm test --prefix npm/dumb-n-honest
      - run: python scripts/package.py --check-tag "$GITHUB_REF_NAME"
      - run: sha256sum dist/*.skill > dist/SHA256SUMS
      - run: gh release create "$GITHUB_REF_NAME" dist/*.skill dist/SHA256SUMS --verify-tag --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}
