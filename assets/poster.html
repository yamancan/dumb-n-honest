<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=1080, initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'; img-src 'self' data:">
  <title>Dumb n Honest</title>
  <style>
    :root { color-scheme: light; --ink:#111; --muted:#676767; --line:#d8d8d8; --paper:#f6f4ef; --owned:#111; --conceded:#c4512d; }
    * { box-sizing: border-box; }
    html, body { margin:0; width:1080px; height:1350px; overflow:hidden; background:var(--paper); color:var(--ink); }
    body { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", monospace; }
    main { width:1080px; height:1350px; padding:72px 72px 60px; display:flex; flex-direction:column; }
    .eyebrow { font-size:18px; letter-spacing:.14em; text-transform:uppercase; color:var(--muted); }
    h1 { margin:18px 0 8px; font-family:ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; font-size:84px; line-height:.95; letter-spacing:-.055em; }
    .dek { max-width:820px; margin:16px 0 18px; font:25px/1.35 ui-sans-serif, system-ui, sans-serif; color:#333; }
    .legend { display:flex; gap:28px; padding:13px 0 15px; border-top:1px solid var(--ink); border-bottom:1px solid var(--line); color:#333; font-size:14px; }
    .legend-item { display:flex; align-items:center; gap:9px; }
    .swatch { width:24px; height:10px; }
    .swatch-owned { background:var(--owned); }
    .swatch-conceded { background:var(--conceded); }
    .models { flex:1; }
    .provider { margin-top:24px; }
    .provider-name { margin-bottom:2px; color:var(--muted); font-size:15px; letter-spacing:.12em; text-transform:uppercase; }
    .model { display:grid; grid-template-columns:1fr 150px; gap:18px; padding:17px 0 15px; border-bottom:1px solid var(--line); }
    .model-name { overflow:hidden; font:700 23px/1.1 ui-sans-serif, system-ui, sans-serif; text-overflow:ellipsis; white-space:nowrap; }
    .meta { overflow:hidden; margin-top:8px; color:var(--muted); font-size:14px; text-overflow:ellipsis; white-space:nowrap; }
    .bar { display:flex; width:100%; height:11px; margin-top:12px; background:#e5e2db; }
    .bar-owned { background:var(--owned); }
    .bar-conceded { background:var(--conceded); }
    .owned-text { color:var(--owned); }
    .conceded-text { color:#a63e20; }
    .rate { text-align:right; font:800 34px/1 ui-sans-serif, system-ui, sans-serif; }
    .rate-label { margin-top:7px; text-align:right; color:var(--muted); font-size:13px; }
    .omitted { margin-top:12px; color:var(--muted); font-size:13px; }
    footer { padding-top:18px; border-top:1px solid var(--ink); font-size:14px; line-height:1.45; color:#333; }
    footer strong { color:var(--ink); }
    .benchmark { margin-top:7px; color:var(--ink); }
  </style>
</head>
<body>
  <main id="poster">
    <div class="eyebrow">Local coding-agent benchmark</div>
    <h1>Dumb n Honest</h1>
    <p class="dek">Correction acknowledgments / 100 answered turns.</p>
    <div class="legend" aria-label="Bar colors"><span class="legend-item"><span class="swatch swatch-owned"></span><span>“I was wrong” — owned error</span></span><span class="legend-item"><span class="swatch swatch-conceded"></span><span>“You’re right” — conceded</span></span></div>
    <section class="models">@@ROWS@@@@OMITTED@@</section>
    <footer><strong>Higher ≠ worse.</strong> Acknowledgment rate, not model error rate.<div class="benchmark">@@BENCHMARK_URL@@</div></footer>
  </main>
  <script>document.documentElement.dataset.overflow = document.querySelector('#poster').scrollHeight > 1350 ? 'true' : 'false';</script>
</body>
</html>
